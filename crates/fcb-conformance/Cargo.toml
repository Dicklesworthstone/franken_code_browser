[package]
name = "fcb-conformance"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Hostile input generation, bounded mutation, and failure-preserving minimization for FCB conformance lanes (FCB-059.A)."

[lib]
name = "fcb_conformance"
path = "src/lib.rs"

[dependencies]
fcb-core = { path = "../fcb-core" }
fcb-document = { path = "../fcb-document" }
fcb-source = { path = "../fcb-source" }
franken_markdown = { git = "https://github.com/Dicklesworthstone/franken_markdown.git", rev = "d6fbd1d5c191b36f4474f7bfd7d544c208c4b9df", default-features = false }

[dev-dependencies]
fcb-test-support = { path = "../fcb-test-support" }

[lints]
rust.missing_debug_implementations = "deny"
