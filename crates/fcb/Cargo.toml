[package]
name = "fcb"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = []
source = ["dep:fcb-source"]
search = ["source", "dep:fcb-search"]
snapshot = ["search", "analysis", "dep:fcb-store"]
map = ["dep:fcb-map"]
analysis = ["dep:fcb-analysis"]
markdown = ["dep:fcb-document"]
view = []
runtime = []
persistence = []
macos-metal = []

[dependencies]
fcb-core = { path = "../fcb-core" }
fcb-source = { path = "../fcb-source", optional = true }
fcb-search = { path = "../fcb-search", optional = true }
fcb-store = { path = "../fcb-store", optional = true }
fcb-map = { path = "../fcb-map", optional = true }
fcb-analysis = { path = "../fcb-analysis", optional = true }
fcb-document = { path = "../fcb-document", optional = true }

[dev-dependencies]
fcb-test-support = { path = "../fcb-test-support" }
